name: Smoke — настоящий Minecraft

# Скачивает Minecraft через ядро Cuber (cuber-cli) с официальных серверов
# и запускает игру. На Linux — в виртуальном дисплее с программным OpenGL,
# с проверкой, что игра работает, и скриншотом. На Windows и macOS у машин CI
# нет видеокарты, поэтому там проверяется установка и старт до создания окна.

on:
  push:
    branches: ["stage-*"]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.20.1", "1.16.5", "1.12.2", "1.8.9", "1.7.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
      - name: Виртуальный дисплей и программный OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick libopenal1 x11-utils
      - name: Сборка cuber-cli
        run: cargo build -p cuber-cli
      - name: Установка и запуск ${{ matrix.version }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          V: ${{ matrix.version }}
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./target/debug/cuber-cli --home "$PWD/home" launch "$V" --nick CuberTest --memory 2048 \
              --wait 150 --expect "Setting user: CuberTest" > out/cli.log 2>&1 &
            CLI=$!
            # Снимок экрана ближе к концу ожидания (игра успевает дойти до меню).
            for i in $(seq 1 140); do sleep 1; kill -0 $CLI 2>/dev/null || break; done
            import -window root out/screen.png 2>/dev/null || true
            wait $CLI; echo "exit=$?" >> out/cli.log
          '
          cat out/cli.log
          grep -q "ПРОВЕРКА ПРОЙДЕНА" out/cli.log
      - name: Повторный запуск не качает заново
        env:
          V: ${{ matrix.version }}
        run: |
          ./target/debug/cuber-cli --home "$PWD/home" install "$V" | tee out/reinstall.log
          ! grep -q "загрузка:" out/reinstall.log
      - name: Логи и скриншот
        if: always()
        run: cp home/cli-logs/*.log out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.version }}
          path: out/

  desktop:
    name: ${{ matrix.os }} · 1.20.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
      - name: Сборка cuber-cli
        run: cargo build -p cuber-cli
      - name: Установка и старт 1.20.1
        shell: bash
        run: |
          mkdir -p out
          ./target/debug/cuber-cli --home "$PWD/home" launch 1.20.1 --nick CuberTest \
            --wait 90 --expect "Setting user: CuberTest" --lenient 2>&1 | tee out/cli.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}
          path: |
            out/
            home/cli-logs/
