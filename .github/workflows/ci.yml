name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Проверка (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json

      - name: Интерфейс — зависимости
        working-directory: apps/launcher
        run: npm ci

      - name: Интерфейс — проверка типов
        working-directory: apps/launcher
        run: npm run check

      - name: Интерфейс — сборка
        working-directory: apps/launcher
        run: npm run build

      - name: Rust — форматирование
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — тесты
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.log

      - name: При падении тестов — вывод в PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f test-output.log ] || exit 0
          {
            echo "### CI: тесты упали на ${{ matrix.os }}"
            echo '```'
            grep -E "panicked|assert|FAILED|failures:|error|---- " test-output.log | tail -n 60 | cut -c1-300
            echo '```'
          } > report.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file report.md
