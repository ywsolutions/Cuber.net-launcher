[workspace]
resolver = "2"
members = ["crates/*", "apps/launcher/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ywsolutions/Cuber.net-launcher"
rust-version = "1.80"

[workspace.dependencies]
cuber-core = { path = "crates/cuber-core" }

anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"

[profile.release]
# Лаунчер должен быть маленьким и быстрым.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
